[server]
default_target = yuchen-X99
bind = 0.0.0.0
port = 8765
token = change-me

[agent]
server = 192.168.2.134
port = 8765
token = change-me
host = yuchen-X99
local_port = 8766
hud = true
allow_clipboard_fallback = false
inject_mode = auto
terminal_classes = gnome-terminal-server,gnome-terminal,konsole,xterm,alacritty,kitty,wezterm,terminator,tilix

[hud]
font_linux = Noto Sans CJK SC
font_windows = Microsoft YaHei UI
offset_x = 18
offset_y = 22

[voice]
# backend: whisper（faster-whisper 本地）或 qwen3（Qwen3-ASR HTTP 服务，自动拉起）
backend = whisper
# qwen3 的子后端：transformers（整段解码）或 vllm（流式）
qwen_backend = transformers
# vllm 子后端自动拉起时的显存占比：0.6B 约 0.35~0.55 够用，1.7B 需要 0.75
qwen_gpu_memory_utilization = 0.75
# backend=qwen3 时，model 指向 Qwen3-ASR 模型目录
qwen_url = http://127.0.0.1:8770/transcribe
# 模型 / 虚拟环境 / 日志的统一存放目录
data_dir = ~/.cache/voice-tunnel
device = USBZH5XK
sample_rate = 16000
channels = 1
ptt_key = KEY_RIGHTCTRL
ptt_device = /dev/input/by-id/usb-ROYUAN_Eopmaker_Keyboard-event-kbd
model = ~/.cache/voice-tunnel/models/faster-whisper-small
partial = true
partial_model = ~/.cache/voice-tunnel/models/faster-whisper-small
partial_interval = 0.5
language = zh
simplify = true
device_type = cuda
compute_type = float16
beam_size = 5
target = active
min_seconds = 0.3
max_seconds = 300
# Qwen3-ASR 领域上下文（系统提示词）。监听端会自动在后面追加服务端在线的设备名，无需手填词表；留空则只发送设备名
context = 程序员日常口述，中英文混合。英文单词、缩写、型号、命令保持原文，数字、IP、端口、版本号一律用阿拉伯数字，公式和代码符号保持原样。
